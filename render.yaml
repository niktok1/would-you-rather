# Render blueprint (CLAUDE.md §8): two environments from one repo, both tracking main.
#   - wyr-server-dev deploys every commit on main once its CI checks pass (checksPass). It has no
#     database of its own: without DATABASE_URL the server runs on in-memory H2, so dev's data
#     resets on every deploy, restart and free-tier spin-down (decided 2026-09-24; a paid Postgres
#     for dev comes later).
#   - wyr-server is production, on wyr-postgres. It never deploys by itself: a person promotes a
#     commit with Render's Manual Deploy, choosing one that is green in CI and already live on dev.
#
# Caveats this config is written around, both from §8:
#   - a free web service spins down after ~15 min idle, so the first request after a quiet spell
#     pays a cold start; every free service in the workspace shares 750 instance hours a month;
#   - free Postgres expires 30 days after creation (then 14 days' grace) — move wyr-postgres to a
#     paid instance type before then to keep production's data.

services:
  - type: web
    name: wyr-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Production deploys only by hand, with Manual Deploy (decided 2026-09-24): promote a commit
    # that is green in CI and already live on wyr-server-dev. Quoted because YAML 1.1 parsers read
    # a bare off as the boolean false.
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      # Internal connection string, not the external one — same region, no public egress.
      - key: DATABASE_URL
        fromDatabase:
          name: wyr-postgres
          property: connectionString
      # Generated once by Render and then held; rotating it invalidates every issued session.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: wyr
      - key: JWT_AUDIENCE
        value: wyr-client
      # Browser clients are cross-origin against this service, so every web origin that should
      # reach the API has to be named here or CORS preflight rejects it.
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      # The moderator's credential (CLAUDE.md §8d): whoever holds it approves and rejects
      # submissions, sent in the X-Admin-Token header. Set by hand in the dashboard and never
      # committed. Unset means moderation is off: the admin routes are 404 and every submission
      # stays pending. Generate one with openssl rand -hex 32. The server reads it at boot, so a
      # change applies once the service restarts with it, and the old token is dead from then on.
      - key: ADMIN_TOKEN
        sync: false
      # The header that names the client's address, so the per-address rate limits (CLAUDE.md §8b)
      # key by the client and not by a proxy. Every request to a Render web service passes through
      # Cloudflare, which sets CF-Connecting-IP to the address that reached it and overwrites any a
      # client sent, so a client cannot pick its own, however many of Render's proxies stand behind.
      # X-Forwarded-For is not read: each proxy appends to it, its leftmost entry is the client's to
      # write, and live Render services have been reported with one Render proxy behind Cloudflare
      # and with two, so no count of entries from the right can be relied on. Unset, the server keys
      # by the socket peer, which here is Render's proxy, one budget for every client, and warns at
      # boot. To be checked once deployed (NEXT-SESSION.md).
      # The RATE_LIMIT_* budgets are not set here, so RateLimits.DEFAULT applies; setting one in the
      # dashboard changes that budget's count at the next restart.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP

  - type: web
    name: wyr-server-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Every commit on main whose CI checks pass (not commit, the deprecated autoDeploy: true, which
    # deploys alongside CI, red or not).
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      # No DATABASE_URL: the server runs on in-memory H2 and says so at boot. Dev's data lives only
      # as long as the instance does.
      # Its own secret, so a session from one environment is refused by the other.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: wyr-dev
      - key: JWT_AUDIENCE
        value: wyr-client
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      # Dev's own moderator token, never production's.
      - key: ADMIN_TOKEN
        sync: false
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP

databases:
  - name: wyr-postgres
    plan: free
    # Must match the web service's region so the internal URL resolves.
    region: frankfurt

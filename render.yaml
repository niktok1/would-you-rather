# Render blueprint (CLAUDE.md §8): two environments from one repo, both tracking main.
#   - wyr-server-dev deploys every commit on main once its CI checks pass (checksPass). It has no
#     database of its own: without DATABASE_URL the server runs on in-memory H2, so dev's data
#     resets on every deploy, restart and free-tier spin-down (decided 2026-09-24; a paid Postgres
#     for dev comes later).
#   - wyr-server is production, on wyr-postgres. It never deploys by itself: a person promotes a
#     commit with Render's Manual Deploy, choosing one that is green in CI and already live on dev.
#
# Production is paid since 2026-09-30, the Play early access (§8): wyr-server on starter ($7, 0.5 CPU,
# 512 MB, never sleeps) and wyr-postgres on basic-256mb ($6), in a Hobby workspace. wyr-server-dev
# stays free, so it spins down after ~15 min idle and the first request after pays a cold start.

services:
  - type: web
    name: wyr-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    branch: main
    # Production deploys only by hand, with Manual Deploy (decided 2026-09-24): promote a commit
    # that is green in CI and already live on wyr-server-dev. Quoted because YAML 1.1 parsers read
    # a bare off as the boolean false.
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      # Internal connection string, not the external one — same region, no public egress.
      - key: DATABASE_URL
        fromDatabase:
          name: wyr-postgres
          property: connectionString
      # Generated once by Render and then held; rotating it invalidates every issued session.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: wyr
      - key: JWT_AUDIENCE
        value: wyr-client
      # Browser clients are cross-origin against this service, so every web origin that should
      # reach the API has to be named here or CORS preflight rejects it.
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      # The moderator's credential (CLAUDE.md §8d): whoever holds it approves and rejects
      # submissions, sent in the X-Admin-Token header. Set by hand in the dashboard and never
      # committed. Unset means moderation is off: the admin routes are 404 and every submission
      # stays pending. Generate one with openssl rand -hex 32. The server reads it at boot, so a
      # change applies once the service restarts with it, and the old token is dead from then on.
      - key: ADMIN_TOKEN
        sync: false
      # The header that names the client's address, so the per-address rate limits (CLAUDE.md §8b)
      # key by the client and not by a proxy. Every request to a Render web service passes through
      # Cloudflare, which sets CF-Connecting-IP to the address that reached it and overwrites any a
      # client sent, so a client cannot pick its own, however many of Render's proxies stand behind.
      # X-Forwarded-For is not read: each proxy appends to it, its leftmost entry is the client's to
      # write, and live Render services have been reported with one Render proxy behind Cloudflare
      # and with two, so no count of entries from the right can be relied on. Unset, the server keys
      # by the socket peer, which here is Render's proxy, one budget for every client, and warns at
      # boot. To be checked once deployed (NEXT-SESSION.md).
      # The RATE_LIMIT_* budgets are not set here, so RateLimits.DEFAULT applies; setting one in the
      # dashboard changes that budget's count at the next restart.
      # Nor are MIN_CLIENT_VERSION_ANDROID, _IOS, _WEB and _DESKTOP, so no build of the game is refused
      # as too old (CLAUDE.md §8b); setting one makes an older build's every request 426.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # The Firebase service account's JSON key file, whole, which pushes a moderator's decision to its
      # author (CLAUDE.md §8b, Push notifications). Set by hand in the dashboard and never committed.
      # Unset means pushes are off: devices still register their tokens, and nothing is sent.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # The game's OAuth client in Google Cloud (type Web application), which exchanges a Play Games
      # sign-in's server auth code (CLAUDE.md §8b, Play Games sign-in). Set by hand, never committed.
      # Both unset means the sign-in is off: its route is not served. One without the other fails at boot.
      - key: PLAY_GAMES_CLIENT_ID
        sync: false
      - key: PLAY_GAMES_CLIENT_SECRET
        sync: false
      # What submitting a question costs, in points (CLAUDE.md §8c). Unset is 1, which it stays until
      # the release; the release sets 50 on this service, and on this service only (the user's
      # decision, 2026-09-26). Declared as a comment until then, so no deploy changes it by itself:
      # - key: SUBMISSION_COST
      #   value: "50"
      # How many days a guest nobody can reach any more is kept: no username, no Play Games link, no
      # session that can still refresh, and idle this long (CLAUDE.md §8b, Guest clean-up). The server
      # deletes such guests at boot and every 24 hours. 90 is also the default; 0 turns it off.
      - key: GUEST_RETENTION_DAYS
        value: "90"

  - type: web
    name: wyr-server-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Every commit on main whose CI checks pass (not commit, the deprecated autoDeploy: true, which
    # deploys alongside CI, red or not).
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      # No DATABASE_URL: the server runs on in-memory H2 and says so at boot. Dev's data lives only
      # as long as the instance does.
      # Its own secret, so a session from one environment is refused by the other.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: wyr-dev
      - key: JWT_AUDIENCE
        value: wyr-client
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      # Dev's own moderator token, never production's.
      - key: ADMIN_TOKEN
        sync: false
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # A key of its own, so production's can be revoked alone.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PLAY_GAMES_CLIENT_ID
        sync: false
      - key: PLAY_GAMES_CLIENT_SECRET
        sync: false
      # GUEST_RETENTION_DAYS is unset, so the default, 90, applies: dev's H2 forgets every guest long
      # before that anyway.
      # What each theme in the shop costs, in points (CLAUDE.md §8d, The shop): 1 on dev, so a tester
      # can buy every theme after a few answers. Unset on wyr-server, whose price is the default, 220.
      - key: THEME_PRICE
        value: "1"

  # The developer's site, https://ntole.com (CLAUDE.md §8, The public site): its root page, and the
  # game's pages Google Play links to under /wyr (the privacy policy, the terms and question rules,
  # account deletion and contact, in Serbian and English). Plain HTML and one CSS file under site/,
  # so the build command only has to exist. A static site takes no plan or region: Render serves it
  # free, from its CDN. It redeploys only for a commit on main that changes site/ and passes CI.
  # Every game page is a draft until its owner completes it (NEXT-SESSION.md), and says so. The two
  # domains are verified in the dashboard once Cloudflare's DNS points them here.
  - type: web
    name: ntole-site
    runtime: static
    domains:
      - ntole.com
      - www.ntole.com
    branch: main
    buildCommand: echo "site/ is plain HTML and CSS, nothing to build"
    staticPublishPath: ./site
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - site/**

databases:
  - name: wyr-postgres
    plan: basic-256mb
    # Must match the web service's region so the internal URL resolves.
    region: frankfurt

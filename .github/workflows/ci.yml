# CI gate in front of deploy (CLAUDE.md §8): ktlint + tests must pass before main is deployable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A private repository's runner has 2 cores and 7 GB. The repository's gradle.properties asks a
      # laptop's 4 GB for Gradle and 3 GB for the Kotlin daemon, which with the test JVMs beside them
      # ran the runner out of memory, and GitHub shut it down mid-test ("The runner has received a
      # shutdown signal"). The user's gradle.properties outranks the project's, so CI's sizes go there.
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          EOF

      # ktlint must fail the build, not warn (CLAUDE.md §5).
      - name: Lint
        run: ./gradlew ktlintCheck --no-daemon

      # JVM-hosted tests: the whole server suite plus the shared client tests, the moderation app's
      # (its screens drawn off screen among them), :core:network's Android host tests
      # (AndroidTokenStorage against a recording SharedPreferences), and the Android app's own (its
      # window theme against the theme's colours). iOS and Android instrumented tests need a mac
      # runner and an emulator respectively, so they are not here.
      - name: Test
        run: ./gradlew :server:test :core:domain:jvmTest :core:data:jvmTest :core:network:jvmTest :core:network:testAndroidHostTest :app:adminApp:jvmTest :app:androidApp:testDevDebugUnitTest --no-daemon

      # The game's JVM tests on their own: hundreds of screens drawn off screen, each Skia surface
      # native memory beside the heap, the heaviest suite, run alone so nothing competes with it.
      - name: Game tests
        run: ./gradlew :app:shared:jvmTest --no-daemon

      # The game's Android host tests: its common tests again on Android's JVM, and the Android-only
      # code no JVM test reaches (ActivityTracker, a notification's tap), over the Android jar's stubs.
      - name: Android host tests
        run: ./gradlew :app:shared:testAndroidHostTest --no-daemon

      # Proves every in-scope client target still compiles, including both web targets, and that R8
      # still shrinks the release build (CLAUDE.md §8, Release builds): without the upload key, which
      # CI never has, it is signed with the debug key, as on a laptop.
      - name: Compile all client targets
        run: |
          ./gradlew --no-daemon \
            :app:shared:compileKotlinJvm \
            :app:shared:compileKotlinJs \
            :app:shared:compileKotlinWasmJs \
            :app:adminApp:compileKotlinJvm \
            :app:adminApp:compileKotlinJs \
            :app:adminApp:compileKotlinWasmJs \
            :app:androidApp:assembleDebug \
            :app:androidApp:assembleProdRelease

      # The release signing rules (CLAUDE.md §8, Release builds), which no compile checks. Without the
      # upload key, which CI never has, what signs prod's bundle, the file Play takes, must refuse before
      # it runs, whether asked for by the bundle's task or by its signing task alone. With one, only prod's
      # release build takes it, so dev's and local's still install over their debug builds: the four
      # values below are placeholders, no key, since signingReport only names each variant's config.
      - name: Release signing
        run: |
          log="$RUNNER_TEMP/release-signing.log"
          for task in bundleProdRelease signProdReleaseBundle; do
            if ./gradlew --no-daemon --dry-run ":app:androidApp:$task" > "$log" 2>&1; then
              cat "$log"; echo "$task ran without the Play upload key"; exit 1
            fi
            grep -q 'must be signed with the Play upload key' "$log" || { cat "$log"; exit 1; }
          done
          WYR_UPLOAD_STORE_FILE=/nonexistent.jks WYR_UPLOAD_STORE_PASSWORD=placeholder \
            WYR_UPLOAD_KEY_ALIAS=placeholder WYR_UPLOAD_KEY_PASSWORD=placeholder \
            ./gradlew --no-daemon :app:androidApp:signingReport > "$log" 2>&1 || { cat "$log"; exit 1; }
          for expected in localRelease:debug devRelease:debug prodRelease:upload; do
            grep -A1 -x "Variant: ${expected%:*}" "$log" | grep -qx "Config: ${expected#*:}" ||
              { cat "$log"; echo "${expected%:*} is not signed with the ${expected#*:} config"; exit 1; }
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  # The same server suite against the engine production runs on. H2 only approximates Postgres,
  # so dialect differences (types, constraint errors, isolation) surface here and nowhere else.
  # ApiFlowTest switches to WYR_TEST_JDBC_URL when it is set and wipes it, Flyway's history
  # included, per test. The schema tests (MigrationsTest, SchemaDriftTest) run on it as well as on
  # H2, so this job is where the migrations are checked against PostgreSQL and where several boots
  # racing on one database are (CLAUDE.md §8b).
  server-postgres:
    runs-on: ubuntu-latest
    # Backstop for a hang (a stuck connection, a test that never returns). GitHub's default is 6h.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a container that lives only as long as this job.
        env:
          POSTGRES_USER: wyr
          POSTGRES_PASSWORD: wyr
          POSTGRES_DB: wyr_test
        ports:
          - 5432:5432
        # Without a health check the steps start as soon as the container exists, before
        # Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U wyr -d wyr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only :server is under test, so skip configuring the app modules (CLAUDE.md §8).
      WYR_SERVER_ONLY: '1'
      WYR_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/wyr_test
      WYR_TEST_DB_USER: wyr
      WYR_TEST_DB_PASSWORD: wyr
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test against Postgres
        run: ./gradlew :server:test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-postgres
          path: '**/build/reports/tests/**'
          retention-days: 7

  # Builds the image Render would build and proves it boots. A fat jar that compiles can still
  # die at startup — this one did, when the jar merge dropped the H2 driver registration — and
  # nothing else runs the Dockerfile at all.
  docker-smoke:
    runs-on: ubuntu-latest
    # The image build downloads Gradle and every dependency with no cache, so it gets more room.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag wyr-server:ci .

      # No DATABASE_URL, so the server falls back to in-memory H2. PORT is set to Render's default
      # of 10000 instead of relying on the 8080 fallback, so the PORT wiring is exercised too.
      - name: Start container
        run: docker run --detach --name wyr-server --env PORT=10000 --publish 8080:10000 wyr-server:ci

      # First boot pays JVM start-up plus schema creation and seeding; ~90s is generous without
      # letting a hung server hold the runner. A container that has already exited fails at once.
      # --max-time caps each attempt at 5s: a server that accepts the connection but never answers
      # would otherwise block one curl indefinitely. The worst case is then 45 x 7s, not forever.
      - name: Wait for /health
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 5 http://localhost:8080/health; then
              echo
              echo "Healthy after ~$((attempt * 2))s"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' wyr-server)" != "true" ]; then
              echo "Container exited before becoming healthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Server did not become healthy after 45 attempts" >&2
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs wyr-server

  # The only place iOS is linked, tested and built as an app: the development machine has no Xcode,
  # which all three need. It can only compile the Kotlin (CLAUDE.md §9).
  ios:
    runs-on: macos-latest
    # macOS minutes bill at 10x, so a hung simulator run must not ride out the 6h default. 45 still
    # leaves room for a cold first run that downloads the whole Kotlin/Native toolchain.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native downloads its compiler and platform dependencies into ~/.konan on first use,
      # which is slow. They change only with the Kotlin version, which lives in the catalog.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # The :core modules' common tests run on the JVM and the Android host; compiling them here too
      # catches what only Kotlin/Native refuses, such as a comma in a test's name.
      - name: Link framework and run simulator tests
        run: |
          ./gradlew --no-daemon \
            :app:shared:linkDebugFrameworkIosSimulatorArm64 \
            :app:shared:iosSimulatorArm64Test \
            :core:domain:compileTestKotlinIosSimulatorArm64 \
            :core:network:compileTestKotlinIosSimulatorArm64 \
            :core:data:compileTestKotlinIosSimulatorArm64

      # The Swift app on top of the framework, built through the project's own "Compile Kotlin
      # Framework" phase (embedAndSignAppleFrameworkForXcode). -target rather than -scheme because
      # no shared scheme is committed; the target already pins ARCHS to arm64. The runner has no
      # signing identity and a simulator build does not need one. It relies on embedAndSign
      # putting Shared on the default framework search path. It passed on the first run
      # (2026-09-24), so it now gates like the rest.
      - name: Build iOS app for the simulator
        run: |
          xcodebuild build \
            -project app/iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ios
          path: '**/build/reports/tests/**'
          retention-days: 7
